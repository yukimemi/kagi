<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 120" role="img" aria-label="kagi — cross-platform key mapper with first-class IME control">
  <title>One keypress fans out to every platform</title>
  <!-- 鍵 — "key". magi collapses three into one; kagi takes one keypress and fans it out. -->
  <!-- icon (matches assets/icon.svg) -->
  <g transform="translate(23, 20) scale(0.31)">
    <g fill="none" stroke-width="18" stroke-linecap="round">
      <rect x="101" y="12" width="54" height="54" rx="14" stroke="#1a1a1a" />
      <path d="M 128 78 L 128 100" stroke="#1a1a1a" />
      <path d="M 50 190 C 50 146, 78 134, 128 112" stroke="#c5582d" />
      <path d="M 128 190 L 128 112" stroke="#0a7e8c" />
      <path d="M 206 190 C 206 146, 178 134, 128 112" stroke="#7d4b9e" />
    </g>
    <rect x="111" y="95" width="34" height="34"
          transform="rotate(45 128 112)"
          fill="#c9a227" />
    <circle cx="50"  cy="216" r="21" fill="#c5582d" />
    <circle cx="128" cy="216" r="21" fill="#0a7e8c" />
    <circle cx="206" cy="216" r="21" fill="#7d4b9e" />
  </g>
  <!-- wordmark -->
  <text x="118" y="68"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-weight="700" font-size="58" letter-spacing="-2"
        fill="#1a1a1a">kagi</text>
  <!-- tagline -->
  <text x="120" y="102"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-style="italic" font-size="16"
        fill="#5a5a5a">鍵 — cross-platform key mapper with first-class IME control</text>
</svg>
