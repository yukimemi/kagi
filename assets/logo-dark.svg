<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 120" role="img" aria-label="kagi — cross-platform key mapper with first-class IME control">
  <title>One keypress fans out to every platform</title>
  <!-- 鍵 — "key". magi collapses three into one; kagi takes one keypress and fans it out. -->
  <!-- icon (same shapes as assets/icon.svg, brighter fills for dark backgrounds) -->
  <g transform="translate(23, 20) scale(0.31)">
    <g fill="none" stroke-width="18" stroke-linecap="round">
      <rect x="101" y="12" width="54" height="54" rx="14" stroke="#f5f5f5" />
      <path d="M 128 78 L 128 100" stroke="#f5f5f5" />
      <path d="M 50 190 C 50 146, 78 134, 128 112" stroke="#e58050" />
      <path d="M 128 190 L 128 112" stroke="#3aa9b8" />
      <path d="M 206 190 C 206 146, 178 134, 128 112" stroke="#b78fe0" />
    </g>
    <rect x="111" y="95" width="34" height="34"
          transform="rotate(45 128 112)"
          fill="#e9c14a" />
    <circle cx="50"  cy="216" r="21" fill="#e58050" />
    <circle cx="128" cy="216" r="21" fill="#3aa9b8" />
    <circle cx="206" cy="216" r="21" fill="#b78fe0" />
  </g>
  <text x="118" y="68"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-weight="700" font-size="58" letter-spacing="-2"
        fill="#f5f5f5">kagi</text>
  <text x="120" y="102"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-style="italic" font-size="16"
        fill="#b8b8b8">鍵 — cross-platform key mapper with first-class IME control</text>
</svg>
