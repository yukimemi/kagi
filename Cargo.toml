[package]
name = "kagikey"
version = "0.6.1"
edition = "2024"
rust-version = "1.85"
description = "Cross-platform key mapper with first-class IME control"
authors = ["yukimemi"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/yukimemi/kagi"
homepage = "https://github.com/yukimemi/kagi"
keywords = ["keyboard", "remap", "ime", "keymap", "hotkey"]
categories = ["command-line-utilities"]
include = [
    "src/**/*.rs",
    "config/kagi.toml",
    "examples/*.rs",
    "assets/icon.svg",
    "assets/logo.svg",
    "assets/logo-dark.svg",
    "Cargo.toml",
    "README.md",
    "LICENSE",
]

# The sibling convention is `<name>-cli` for the package and `<name>` for the
# binary (yui ships as `yui-cli`). `kagi-cli` is taken on crates.io by an
# unrelated Kagi.com API client, and plain `kagi` by an abandoned key-value
# store, so the package is `kagikey`; the binary keeps the short name.
[[bin]]
name = "kagi"
path = "src/main.rs"

# `self-update` pulls kaishin, and through it reqwest/rustls/aws-lc-sys, which
# needs a C toolchain. Turning it off yields a pure-Rust build — what a distro
# package wants (the package manager owns updates), and what makes
# `cargo check --target <other-os> --no-default-features` work from any host.
[features]
default = ["self-update"]
self-update = ["dep:kaishin", "dep:tokio"]

[dependencies]
anyhow = "1"
bitflags = "2"
clap = { version = "4", features = ["derive"] }
kaishin = { version = "0.7.5", optional = true }
serde = { version = "1", features = ["derive"] }
teravars = { version = "0.2.2", features = ["merge"] }
tokio = { version = "1.53.1", features = [
  "rt",
  "rt-multi-thread",
  "time",
  "macros",
], optional = true }
toml = "1.1.6"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"
core-graphics = "0.25.0"
foreign-types = "0.5"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_System_Console",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_Input_Ime",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
